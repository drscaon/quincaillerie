name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint and format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install "ruff==0.16.9"
      - run: ruff check .
      - run: ruff format --check .

  test:
    name: Tests (Python ${{ matrix.python-version }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]
        include:
          # one run on each other platform, on a recent Python
          - os: macos-latest
            python-version: "3.12"
          - os: windows-latest
            python-version: "3.12"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[dev]"
      - name: Test
        run: pytest
      - name: Command-line smoke test
        run: |
          quincaillerie --version
          quincaillerie list
          quincaillerie generate screw M6 --length 16 --with nut,washer --count 3 --out ci-output
          quincaillerie generate cell 18650 --with holder --out ci-output
          quincaillerie blender-addon --out ci-output/quincaillerie_physics.zip

  sim:
    name: MuJoCo checks of the whole catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install
        run: pip install -e ".[sim]"
      - name: Generate the catalogue (nominal parts)
        run: quincaillerie generate all --nominal --out ci-output
      - name: Drop, nut on screw, holders, seated cells, insertions
        run: quincaillerie sim-test ci-output/catalog
      - name: Varied batches (tolerances, defects, wear, physics), crushed threads must jam a nut
        run: |
          quincaillerie generate screw M8 --with nut --count 6 --defect-rate 0.5 --detail low --out ci-varied
          quincaillerie sim-test ci-varied/ISO4017_M8x30 --defects
          for f in AA 9V CR2032; do
            quincaillerie generate cell $f --with holder --count 5 --defect-rate 0.4 --out ci-varied
            quincaillerie sim-test ci-varied/Cell_$f
          done
      - name: Screwing (M8)
        run: |
          quincaillerie generate screw M8 --with nut --no-scene --out ci-output
          quincaillerie sim-test ci-output/ISO4017_M8x30 --screwing --only screwing
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-mujoco
          path: |
            ci-output/*/sim_test/*.json
            ci-varied/*/sim_test/*.json
          retention-days: 14

  blender:
    name: Blender checks of the whole catalogue
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"  # the bpy module is built for one Python version
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: System libraries for bpy
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends libxrender1 libxxf86vm1 libxfixes3 libxi6 libxkbcommon0 libsm6 libgl1 libegl1
      - name: Install
        run: pip install -e . bpy
      - name: Generate the catalogue (nominal parts)
        run: quincaillerie generate all --nominal --out ci-output
      - name: Gravity checks through the add-on
        run: quincaillerie blender-test ci-output/catalog
      - name: The same on varied batches
        run: |
          quincaillerie generate screw M8 --with nut --count 6 --defect-rate 0.5 --detail low --out ci-varied
          quincaillerie blender-test ci-varied/ISO4017_M8x30
          quincaillerie generate cell AA --with holder --count 5 --defect-rate 0.4 --out ci-varied
          quincaillerie blender-test ci-varied/Cell_AA
      - name: The same, set up by hand (for comparison, not a gate)
        run: quincaillerie blender-test ci-output/catalog --mode naive
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: sim-test-blender
          path: |
            ci-output/catalog/sim_test/blender_*.json
            ci-varied/*/sim_test/blender_*.json
          retention-days: 14

  build:
    name: Build packages
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install build twine
      - run: python -m build
      - name: Check package metadata
        run: twine check --strict dist/*
      - name: Install the wheel in a clean environment
        run: |
          python -m venv /tmp/venv
          /tmp/venv/bin/pip install dist/*.whl
          /tmp/venv/bin/quincaillerie --version
          /tmp/venv/bin/quincaillerie generate nut M5 --out /tmp/out
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
          retention-days: 14
